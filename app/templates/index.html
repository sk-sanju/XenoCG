<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XenoCG v1 – Instagram Batch Generator</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #fff;
    }

    .card {
        width: 100%;
        max-width: 520px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 18px;
        padding: 36px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    h1 {
        font-size: 1.6rem;
        margin-bottom: 10px;
    }

    p {
        font-size: 0.95rem;
        opacity: 0.8;
        margin-bottom: 25px;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(90deg, #3b82f6, #2563eb);
        color: white;
        transition: 0.3s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
    }

    button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
    }

    .loader {
        display: none;
        margin: 18px auto;
        border: 4px solid rgba(255,255,255,0.2);
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    a.download {
        display: none;
        margin-top: 20px;
        color: #38bdf8;
        font-weight: 600;
        text-decoration: none;
    }

    a.download:hover {
        text-decoration: underline;
    }
</style>
</head>

<body>

<div class="card">
    <h1>XenoCG v1</h1>
    <p>Generate 30 Instagram posts in one click and download as a ZIP file</p>

    <button id="generateBtn">Generate Batch</button>
    <div class="loader" id="loader"></div>

    <a id="downloadLink" class="download" href="#">Download ZIP</a>
</div>

<script>
    const btn = document.getElementById('generateBtn');
    const link = document.getElementById('downloadLink');
    const loader = document.getElementById('loader');

    btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Generating...';
        loader.style.display = 'block';
        link.style.display = 'none';

        try {
            const res = await fetch('/generate-30-posts');
            if (!res.ok) throw new Error('Failed request');

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);

            const now = new Date().toISOString().replace(/[:.]/g, '_');

            link.href = url;
            link.download = `xenocg_batch_${now}.zip`;
            link.textContent = 'Download ZIP';
            link.style.display = 'inline-block';

            btn.textContent = 'Generated Successfully';
        } catch (e) {
            console.error(e);
            btn.textContent = 'Error – Try Again';
        } finally {
            loader.style.display = 'none';
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
